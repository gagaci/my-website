<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khabib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  @keyframes blink95 { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  svg { shape-rendering: crispEdges; }
  ::selection { background:#000080; color:#fff; }

  /* hover / pressed helpers (ported from the original style-hover / style-active attrs) */
  .tile:hover { background:#eef3fb; }
  .row:hover { background:#eef3fb; }
  .tree-item:hover { background:#e8eef7; }
  .menu span:hover { background:#000080; color:#fff; }
  .btn:active { box-shadow: inset 1px 1px #000, inset -1px -1px #fff, inset 2px 2px #808080, inset -2px -2px #dfdfdf !important; }
  .tbtn.disabled { color:#808080 !important; cursor:default !important; pointer-events:none !important; }

  /* document body (opened essays / projects) */
  .doc-body { font-size:14px; line-height:1.65; color:#222; }
  .doc-body h1 { font-family:'Pixelify Sans',sans-serif; font-size:24px; line-height:1.1; margin:0 0 12px; color:#0a0a0a; }
  .doc-body h2 { font-family:'Pixelify Sans',sans-serif; font-size:19px; line-height:1.15; margin:22px 0 10px; color:#0a0a0a; }
  .doc-body h3 { font-size:15px; font-weight:700; margin:18px 0 8px; color:#0a0a0a; }
  .doc-body p { margin:0 0 15px; text-wrap:pretty; }
  .doc-body ul, .doc-body ol { margin:0 0 15px; padding-left:22px; }
  .doc-body li { margin:0 0 6px; }
  .doc-body a { color:#000080; }
  .doc-body code { font-family:'VT323',monospace; font-size:16px; background:#eee; padding:0 3px; }
  .doc-body pre.code-block { font-family:'VT323',monospace; font-size:16px; background:#000080; color:#fff; padding:10px 12px; overflow:auto; margin:0 0 15px; }
  .doc-body blockquote { margin:0 0 15px; padding:6px 12px; border-left:3px solid #000080; color:#444; background:#f4f4f0; }
  .doc-body hr { border:0; border-top:1px solid #c8c8c8; margin:18px 0; }
  .doc-links { margin-top:18px; padding-top:14px; border-top:1px solid #e2e2e2; font-size:13px; }
  .doc-links a { color:#000080; margin-right:16px; }

  /* ===== mobile / narrow screens ===== */
  #btn-folders { display:none; }
  @media (max-width: 640px) {
    #menubar { display:none !important; }
    #btn-folders { display:flex !important; }
    .tb-extra { display:none !important; }

    /* folder tree becomes a slide-in drawer over the file view */
    #panes { position:relative; }
    #tree-pane {
      position:absolute !important;
      top:0; left:0; bottom:0;
      width:230px !important; max-width:82%;
      margin:0 !important;
      transform:translateX(-110%);
      transition:transform .18s ease;
      z-index:30;
    }
    #tree-pane.show { transform:translateX(0); }
    #tree-backdrop.show { display:block !important; }
    #fileview { margin-left:0 !important; }

    .hello-h { font-size:28px !important; }
    .folder-h { font-size:23px !important; }

    /* drop the Type column so Name has room */
    .col-type, .cell-type { display:none !important; }

    /* keep only the middle status segment */
    #st-left, #st-free { display:none !important; }

    /* keep the taskbar window button from forcing overflow */
    #tb-winbtn { min-width:0 !important; flex:1 1 auto; overflow:hidden; }
    #tb-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  }
</style>
</head>
<body>

<div style="position:relative; height:100vh; min-height:600px; background:#008080; font-family:Tahoma,'Segoe UI',Geneva,sans-serif; color:#000; overflow:hidden;">

var SITE = {"name": "khabib", "description": "Essays, projects, and random thoughts", "sections": [{"id": "essays", "icon": "ic-doc", "name": "Essays", "verb": "read", "desc": "Long-form thoughts on technology, life, and everything in between."}, {"id": "projects", "icon": "ic-folder", "name": "Projects", "verb": "explore", "desc": "Things I've built and shipped into the world."}, {"id": "bookmarks", "icon": "ic-star", "name": "Bookmarks", "verb": "browse", "desc": "Links I find interesting and worth sharing."}, {"id": "about", "icon": "ic-person", "name": "About", "verb": "info", "desc": "Who I am and what I'm working on."}, {"id": "videos", "icon": "ic-video", "name": "Videos", "verb": "watch", "desc": "Videos I've made and published on YouTube."}], "pages": {"essays": {"icon": "ic-doc", "name": "Essays", "desc": "Long-form thoughts on technology, life, and everything in between.", "detailLabel": "Modified", "items": [{"icon": "ic-doc", "name": "How to Maintain Energy for a Very Long Time", "type": "Text Document", "detail": "07/26/2026", "body": "<p>If you see a person who can hardly make his bed, or someone with an endless drive to pursue the things they want, the difference is in dopamine. Most people think dopamine is the \"happiness chemical.\" This is not the case — it is a chemical in our body that pushes us to seek resources: food, shelter, status, sex, and so on.<\/p>\n\n<figure style=\"margin: 24px 0; border: 2px solid #808080; box-shadow: inset -1px -1px 0 #fff, inset 1px 1px 0 #000; background: #fff; padding: 16px;\">\n  <svg viewBox=\"0 0 640 320\" width=\"100%\" role=\"img\" aria-label=\"Graph of the dopamine system showing a spike above baseline after an activity, followed by a dip below baseline before returning to baseline.\" style=\"display:block;\">\n    <rect x=\"60\" y=\"20\" width=\"540\" height=\"240\" fill=\"#f4f4f4\" stroke=\"#808080\" stroke-width=\"1\"/>\n    <line x1=\"60\" y1=\"150\" x2=\"600\" y2=\"150\" stroke=\"#000080\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n    <text x=\"66\" y=\"144\" font-family=\"VT323, monospace\" font-size=\"18\" fill=\"#000080\">Baseline<\/text>\n    <path d=\"M 60 150 L 150 150 C 190 150, 205 55, 250 55 C 300 55, 315 150, 360 150 C 400 150, 420 225, 470 225 C 530 225, 560 150, 600 150\" fill=\"none\" stroke=\"#c00000\" stroke-width=\"3\"/>\n    <circle cx=\"250\" cy=\"55\" r=\"4\" fill=\"#c00000\"/>\n    <circle cx=\"470\" cy=\"225\" r=\"4\" fill=\"#c00000\"/>\n    <text x=\"250\" y=\"44\" font-family=\"VT323, monospace\" font-size=\"18\" fill=\"#c00000\" text-anchor=\"middle\">Increase<\/text>\n    <text x=\"470\" y=\"246\" font-family=\"VT323, monospace\" font-size=\"18\" fill=\"#c00000\" text-anchor=\"middle\">Decrease<\/text>\n    <text x=\"150\" y=\"140\" font-family=\"VT323, monospace\" font-size=\"16\" fill=\"#404040\" text-anchor=\"middle\">activity<\/text>\n    <text x=\"330\" y=\"292\" font-family=\"VT323, monospace\" font-size=\"18\" fill=\"#000\" text-anchor=\"middle\">time &rarr;<\/text>\n    <text x=\"30\" y=\"150\" font-family=\"VT323, monospace\" font-size=\"18\" fill=\"#000\" text-anchor=\"middle\" transform=\"rotate(-90 30 150)\">dopamine<\/text>\n  <\/svg>\n  <figcaption style=\"font-family: VT323, monospace; font-size: 16px; color: #404040; text-align: center; margin-top: 8px;\">The dopamine system: an activity drives a spike above baseline, followed by a dip below it before returning to rest.<\/figcaption>\n<\/figure>\n\n<p>The most important thing to keep in mind is that dopamine is not infinite — it depletes over time. Imagine it as a container filled with water. Some activities take up more water and some take up little. After you initiate an activity, there is an increase in the dopamine system; after a period of time it decreases beneath the baseline.<\/p>\n\n<p>Huberman explores this phenomenon amazingly. Imagine a person who lived 10,000 years ago. He wakes up and finds that there is minimal water and food. Dopamine forces him to seek out and find an animal to eat. As soon as he finds one, his level of dopamine drops to baseline — because, as we mentioned, dopamine is finite. Thus it reserves itself until the next hunt.<\/p>\n\n<h2>Some tips to keep your energy [dopamine] level high<\/h2>\n\n<ol><li><strong>Cold shower:<\/strong> start with minimal exposure, and be careful.<\/li><li><strong>Do not stack dopaminergic activities:<\/strong> going to the gym with pre-workout + coffee + music. This will diminish the value of the raw activity. Use extra energizers only when it is necessary.<\/li><\/ol>\n<h2>References<\/h2>\n\n<ul><li><a href=\"https://youtu.be/QmOF0crdyRU?si=s_btIe6jgm0ypO6T\">Controlling Your Dopamine For Motivation, Focus & Satisfaction — Huberman Lab<\/a><\/li><li><a href=\"https://youtu.be/35lS7gJVTyA?si=araYhTfMDYrTrxnx\">Leverage Dopamine to Overcome Procrastination & Optimize Effort — Huberman Lab<\/a><\/li><\/ul>"}, {"icon": "ic-doc", "name": "Why Simple Things Are Hard", "type": "Text Document", "detail": "02/15/2026", "body": "<p>There's a peculiar paradox in building things: the simpler something appears, the harder it usually was to make. This seems counterintuitive. Shouldn't simple things be... simple to create?<\/p>\n\n<p>I've been thinking about this a lot lately. Every time I sit down to build something \"simple,\" I end up in a rabbit hole of complexity. A basic to-do app becomes a meditation on state management. A landing page spirals into typography hell. A \"quick script\" evolves into a distributed system.<\/p>\n\n<h2>The Complexity Iceberg<\/h2>\n\n<p>Simple things are hard because simplicity is the result of ruthless editing. It's not the absence of complexity—it's complexity that's been carefully hidden, resolved, or eliminated entirely.<\/p>\n\n<p>Think of an iceberg. The visible part—the simple interface, the clean design, the obvious feature—is just 10% of the work. Below the waterline sits the other 90%: edge cases handled, decisions made, alternatives rejected, and compromises reached.<\/p>\n\n<blockquote>\"I would have written a shorter letter, but I did not have the time.\" — Blaise Pascal (maybe) <\/blockquote>\nPascal's quote captures it perfectly. Brevity takes effort. Simplicity takes even more.\n\n<h2>The Three Enemies of Simple<\/h2>\n\n<p>In my experience, simplicity has three main enemies:<\/p>\n\n<ol><li><strong>Feature creep:<\/strong> The temptation to add \"just one more thing\" because it might be useful someday.<\/li><li><strong>Premature abstraction:<\/strong> Building for flexibility you don't need yet, adding layers that obscure rather than clarify.<\/li><li><strong>Fear of commitment:<\/strong> Refusing to make decisions, keeping options open, and ending up with a mess of configurable complexity.<\/li><\/ol>\nEach of these feels productive in the moment. Feature creep masquerades as thoroughness. Abstraction feels like good engineering. Keeping options open seems prudent. But they all lead to the same place: complicated systems that are hard to use and harder to maintain.\n\n<h2>The Discipline of Deletion<\/h2>\n\n<p>The solution is deletion. Not just of code, but of ideas. Of possibilities. Of the fear that you're missing something important.<\/p>\n\n<p>Every feature you don't build is a feature you don't have to maintain. Every option you don't offer is a decision your users don't have to make. Every line of code you don't write is a line that can't have bugs.<\/p>\n\n<p>This is harder than it sounds. We're wired to add, not subtract. Removing something feels like loss, even when that something was making things worse.<\/p>\n\n<h2>Simple Is Not Easy<\/h2>\n\n<p>There's a distinction worth making here: simple is not the same as easy.<\/p>\n\n<ul><li><strong>Easy<\/strong> means low effort<\/li><li><strong>Simple<\/strong> means low complexity<\/li><\/ul>\nThese often point in opposite directions. The easy path is to add another option, another feature, another layer of abstraction. The simple path requires the hard work of understanding what's essential and having the courage to cut everything else.\n\n<p>Simple is a destination you reach through difficulty, not a shortcut that avoids it.<\/p>\n\n<h2>Practicing Simplicity<\/h2>\n\n<p>How do you get better at making simple things? A few approaches I've found helpful:<\/p>\n\n<ul><li><strong>Start with constraints.<\/strong> Limit your tools, your time, your scope. Constraints force creativity and prevent sprawl.<\/li><li><strong>Ship early.<\/strong> The sooner you put something in front of users, the sooner you learn what's actually necessary.<\/li><li><strong>Revisit and remove.<\/strong> Schedule time specifically for deletion. What can you take away without losing value?<\/li><li><strong>Study simple things.<\/strong> Use products that feel effortless and try to understand how they got there.<\/li><\/ul>\nSimplicity is a skill. Like any skill, it improves with practice and intention.\n\n<h2>The Payoff<\/h2>\n\n<p>Why bother with all this? Because simple things are better. They're easier to use, easier to understand, easier to maintain, and easier to love. They respect the user's time and attention. They solve the problem without creating new ones.<\/p>\n\n<p>And perhaps most importantly: simple things last. Complexity is fragile. Simplicity is resilient.<\/p>\n\n<p>So next time you're building something and it feels too hard for how simple the result should be—take heart. That difficulty is the price of simplicity. And it's worth paying.<\/p>"}, {"icon": "ic-doc", "name": "The Art of Doing Nothing", "type": "Text Document", "detail": "01/20/2026", "body": "<p>We live in an era of relentless productivity. Every minute must be optimized. Every moment monetized. Every gap filled with podcasts, audiobooks, or \"quick wins.\"<\/p>\n\n<p>I want to make a case for doing nothing.<\/p>\n\n<h2>The Cult of Busy<\/h2>\n\n<p>Somewhere along the way, being busy became a status symbol. \"How are you?\" \"Busy!\" we respond, almost proudly. As if constant motion were proof of importance.<\/p>\n\n<p>But busyness is often just noise. It's the appearance of progress without the substance. We confuse activity with achievement, motion with meaning.<\/p>\n\n<h2>What Happens in the Gaps<\/h2>\n\n<p>The mind needs idle time. Not distracted time—scrolling, watching, listening—but truly unoccupied time. Time to wander.<\/p>\n\n<p>This is when:<\/p>\n\n<ul><li>Problems solve themselves in the background<\/li><li>Unexpected connections form<\/li><li>Creativity emerges unbidden<\/li><li>Perspective returns<\/li><\/ul>\nThe shower insight is real. So is the walk epiphany. These don't happen despite the lack of \"input\"—they happen because of it.\n\n<h2>The Practice<\/h2>\n\n<p>Doing nothing is harder than it sounds. Our instinct is to reach for the phone, fill the silence, avoid the discomfort of stillness.<\/p>\n\n<p>Some ways to practice:<\/p>\n\n<ol><li><strong>Sit without your phone.<\/strong> Just five minutes. Notice what arises.<\/li><li><strong>Walk without headphones.<\/strong> Let your mind wander with your feet.<\/li><li><strong>Stare out windows.<\/strong> It's not wasting time; it's thinking.<\/li><li><strong>Wait without distraction.<\/strong> In lines, in lobbies, in life.<\/li><\/ol>\n<h2>The Return<\/h2>\n\n<p>After doing nothing, you return to doing something with fresh eyes. The urgent seems less urgent. The important becomes clearer. The path forward appears.<\/p>\n\n<p>Doing nothing is not the opposite of productivity. It's the foundation of it.<\/p>"}]}, "projects": {"icon": "ic-folder", "name": "Projects", "desc": "Things I've built and shipped into the world.", "detailLabel": "Status", "items": [{"icon": "ic-folder", "name": "Minimal Blog Engine", "type": "Application", "detail": "Active", "body": "<h1>About<\/h1>\n\n<p>Minimal Blog Engine is exactly what it sounds like: a way to turn Markdown files into a website with zero configuration and zero dependencies beyond Python 3.<\/p>\n\n<p>I built this because every other static site generator I tried was either too complicated, too slow, or required me to learn Yet Another Configuration Language.<\/p>\n\n<h1>Features<\/h1>\n\n<ul><li><strong>500 lines of Python<\/strong> — Read the entire source in one sitting<\/li><li><strong>Zero dependencies<\/strong> — Just Python 3.8+<\/li><li><strong>Markdown to HTML<\/strong> — With syntax highlighting<\/li><li><strong>RSS feed<\/strong> — Generated automatically<\/li><li><strong>Fast<\/strong> — Builds 1000 posts in under 2 seconds<\/li><li><strong>Live reload<\/strong> — For local development<\/li><\/ul>\n<h1>Quick Start<\/h1>\n\n<p>Clone the repo and run:<\/p>\n\n<pre class=\"code-block\"># Clone the repository\ngit clone https://github.com/gagaci/my-website\ncd my-website\n\n<h1>Create your first post<\/h1>\necho \"# Hello World\" &gt; posts/hello.md\n\n<h1>Build the site<\/h1>\npython blog.py build\n\n<h1>Start local server<\/h1>\npython blog.py serve\n<\/pre>\n\n<h1>Why Another SSG?<\/h1>\n\n<p>I was tired of:<\/p>\n\n<ul><li>Jekyll's Ruby dependencies breaking after every OS update<\/li><li>Hugo's Go templates being unreadable<\/li><li>Gatsby taking 45 seconds to build 10 pages<\/li><li>Every SSG requiring a config file longer than my actual content<\/li><\/ul>\nSo I wrote my own. It does exactly what I need and nothing more.\n\n<h1>License<\/h1>\n\n<p>MIT — Do whatever you want with it.<\/p>", "url": "https://github.com/gagaci/my-website", "github": "https://github.com/gagaci/my-website"}, {"icon": "ic-folder", "name": "Morning Bot", "type": "Application", "detail": "Active", "body": "<h1>About<\/h1>\n\n<p>Morning Bot is a TypeScript Telegram bot that sends a daily personal briefing. It brings together weather, calendar events, Canvas assignments, and Jira focus items into short Telegram messages.<\/p>\n\n<h1>Features<\/h1>\n\n<ul><li><strong>Daily schedule<\/strong> — Runs on a configurable morning cron schedule<\/li><li><strong>On-demand briefings<\/strong> — Send <code>/brief<\/code> in Telegram to generate the briefing whenever you want<\/li><li><strong>Multiple sources<\/strong> — Combines weather, calendar, Canvas, and Jira context<\/li><li><strong>Telegram-first<\/strong> — Sends clean HTML-formatted Telegram messages<\/li><\/ul>\n<h1>Tech Stack<\/h1>\n\n<ul><li>TypeScript<\/li><li>node-telegram-bot-api<\/li><li>node-cron<\/li><li>OpenAI<\/li><li>Axios<\/li><\/ul>\n<h1>Repository<\/h1>\n\n<p><a href=\"https://github.com/gagaci/my-telegram-bot\">View on GitHub<\/a><\/p>", "url": "https://github.com/gagaci/my-telegram-bot", "github": "https://github.com/gagaci/my-telegram-bot"}, {"icon": "ic-folder", "name": "Webster Bot", "type": "Application", "detail": "Active", "body": "<h1>About<\/h1>\n\n<p>Webster Bot is a focused Telegram bot for Webster University Canvas assignments. It checks Canvas, formats upcoming work, and sends it through Telegram on a daily schedule or on demand.<\/p>\n\n<h1>Features<\/h1>\n\n<ul><li><strong>Canvas assignments<\/strong> — Pulls upcoming assignments into Telegram<\/li><li><strong>Daily reminders<\/strong> — Runs on an 8am-style cron schedule by default<\/li><li><strong>On-demand command<\/strong> — Send <code>/brief<\/code> to fetch assignments manually<\/li><li><strong>Small surface area<\/strong> — Built around one useful workflow: knowing what is due<\/li><\/ul>\n<h1>Tech Stack<\/h1>\n\n<ul><li>TypeScript<\/li><li>node-telegram-bot-api<\/li><li>node-cron<\/li><li>OpenAI<\/li><li>Axios<\/li><\/ul>\n<h1>Repository<\/h1>\n\n<p><a href=\"https://github.com/gagaci/webster-telegram-bot\">View on GitHub<\/a><\/p>", "url": "https://github.com/gagaci/webster-telegram-bot", "github": "https://github.com/gagaci/webster-telegram-bot"}]}, "bookmarks": {"icon": "ic-star", "name": "Bookmarks", "desc": "Links I find interesting and worth sharing.", "detailLabel": "Address", "items": [{"icon": "ic-star", "name": "Hacker News", "type": "Internet Shortcut", "detail": "news.ycombinator.com", "url": "https://news.ycombinator.com", "open": "external"}, {"icon": "ic-star", "name": "Are.na", "type": "Internet Shortcut", "detail": "are.na", "url": "https://www.are.na", "open": "external"}, {"icon": "ic-star", "name": "MDN Web Docs", "type": "Internet Shortcut", "detail": "developer.mozilla.org", "url": "https://developer.mozilla.org", "open": "external"}, {"icon": "ic-star", "name": "Wayback Machine", "type": "Internet Shortcut", "detail": "web.archive.org", "url": "https://web.archive.org", "open": "external"}]}, "about": {"icon": "ic-person", "name": "About", "kind": "about", "desc": "Who I am and what I'm working on.", "body": ["I'm khabib — a builder, writer, and tinkerer.", "This is my corner of the internet: essays I'm working through, projects I've shipped, and links worth keeping. The whole thing runs on a small static-site generator I wrote myself."], "links": [{"name": "X", "detail": "@khabibbayramov", "url": "https://x.com/khabibbayramov"}, {"name": "GitHub", "detail": "gagaci", "url": "https://github.com/gagaci"}, {"name": "LeetCode", "detail": "gagaci", "url": "https://leetcode.com/u/gagaci/"}, {"name": "Telegram", "detail": "@gagaci", "url": "https://t.me/gagaci"}, {"name": "Instagram", "detail": "bayramov.xv", "url": "https://instagram.com/bayramov.xv"}]}, "videos": {"icon": "ic-video", "name": "Videos", "desc": "Videos I've made and published on YouTube.", "detailLabel": "Published", "items": [{"icon": "ic-video", "name": "explanation of 'me too' meme from my pov", "type": "Video Clip", "detail": "04/19/2026", "url": "https://youtu.be/R5Z3OQLln0U", "open": "external"}]}}};
var SECTIONS = SITE.sections;
var PAGES = SITE.pages;
var SITE_NAME = SITE.name;

var state = { view: 'home', history: ['home'], hi: 0, selected: null };

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }

function setView(view){
  if (view === state.view){ state.selected = null; return render(); }
  var history = state.history.slice(0, state.hi + 1);
  history.push(view);
  state.history = history; state.hi = history.length - 1; state.view = view; state.selected = null;
  render();
}
function goBack(){ if (state.hi > 0){ state.hi--; state.view = state.history[state.hi]; state.selected = null; render(); } }
function goFwd(){ if (state.hi < state.history.length - 1){ state.hi++; state.view = state.history[state.hi]; state.selected = null; render(); } }
function parentOf(v){ if (v.indexOf('doc:') === 0) return v.split(':')[1]; if (v === 'home') return null; return 'home'; }
function goUp(){ var p = parentOf(state.view); if (p !== null) setView(p); }

function parseView(){
  var v = state.view;
  if (v === 'home') return { isHome: true };
  if (v.indexOf('doc:') === 0){
    var parts = v.split(':'); var sec = parts[1]; var idx = +parts[2];
    return { isDoc: true, sec: sec, idx: idx, item: PAGES[sec].items[idx] };
  }
  var page = PAGES[v];
  return { isFolder: true, view: v, page: page, isAbout: page.kind === 'about' };
}

/* ---------- file view builders ---------- */
function homeHTML(){
  var sel = state.selected;
  var tiles = SECTIONS.map(function(it){
    var s = it.id === sel;
    var ring = s ? 'background:#cfe0f5; outline:1px dotted #00308a; outline-offset:-2px;' : '';
    var lbl = s ? 'background:#000080; color:#fff;' : 'color:#000;';
    return '<div class="tile" data-tile="'+it.id+'" style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:13px 8px 10px; cursor:pointer; '+ring+'">'
      + '<svg width="44" height="44"><use href="#'+it.icon+'"></use></svg>'
      + '<span style="font-size:13px; text-align:center; padding:1px 6px; '+lbl+'">'+esc(it.name)+'</span>'
      + '<span style="font-size:11px; color:#8a8a8a;">'+esc(it.verb)+'</span>'
      + '</div>';
  }).join('');
  var about = SITE.pages && SITE.pages.about;
  var findMe = '';
  if (about && about.links && about.links.length){
    var linkEls = about.links.map(function(l){
      return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener" style="color:#000080; text-decoration:underline;">'+esc(l.name)+'</a>';
    }).join('<span style="color:#c8c8c8;"> · </span>');
    findMe = '<div style="padding:2px 20px 18px;">'
      + '<div style="font-size:12px; color:#555; margin-bottom:6px;">You can find me here:</div>'
      + '<div style="font-size:13px; display:flex; flex-wrap:wrap; align-items:center; gap:2px 4px;">'+linkEls+'</div>'
      + '</div>';
  }
  return '<div>'
    + '<div style="display:flex; flex-wrap:wrap; gap:22px 28px; align-items:center; padding:22px 26px 20px; border-bottom:1px solid #e2e2e2; background:linear-gradient(180deg,#f6f6f3,#fff);">'
    +   '<div style="flex:1; min-width:280px;">'
    +     '<div class="hello-h" style="font-family:\'Pixelify Sans\',sans-serif; font-weight:700; font-size:38px; line-height:1; color:#0a0a0a;">Hello, I\'m '+esc(SITE_NAME)+'.</div>'
    +     '<div style="font-size:14px; color:#555; margin-top:10px;">'+esc(SITE.description)+'</div>'
    +   '</div>'
    + '</div>'
    + '<div style="padding:22px 20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px 6px; align-content:start;">'+tiles+'</div>'
    + '<div style="padding:8px 20px 16px; font-size:11px; color:#9a9a9a;">Tip: double-click an item to open it — or pick a folder from the tree.</div>'
    + findMe
    + '</div>';
}

function folderHeaderHTML(icon, name, desc){
  return '<div style="display:flex; align-items:center; gap:16px; padding:20px 26px 18px; border-bottom:1px solid #e2e2e2; background:linear-gradient(180deg,#f6f6f3,#fff);">'
    + '<svg width="40" height="40"><use href="#'+icon+'"></use></svg>'
    + '<div style="min-width:0;">'
    +   '<div class="folder-h" style="font-family:\'Pixelify Sans\',sans-serif; font-weight:700; font-size:30px; line-height:1; color:#0a0a0a;">'+esc(name)+'</div>'
    +   (desc ? '<div style="font-size:13px; color:#555; margin-top:7px;">'+esc(desc)+'</div>' : '')
    + '</div></div>';
}

function listHTML(page){
  var rows = page.items.map(function(r, i){
    var s = state.selected === 'row:' + i;
    var rowStyle = s ? 'background:#cfe0f5;' : '';
    var nameStyle = s ? 'background:#000080; color:#fff;' : 'color:#000;';
    return '<div class="row" data-row="'+i+'" style="display:flex; align-items:center; padding:3px 0; cursor:pointer; '+rowStyle+'">'
      + '<div style="flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding-left:8px;"><svg width="18" height="18" style="flex:none;"><use href="#'+r.icon+'"></use></svg><span style="font-size:13px; padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; '+nameStyle+'">'+esc(r.name)+'</span></div>'
      + '<div class="cell-type" style="width:150px; flex:none; font-size:12px; color:#333; padding:0 8px;">'+esc(r.type)+'</div>'
      + '<div style="width:170px; flex:none; font-size:12px; color:#333; padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(r.detail)+'</div>'
      + '</div>';
  }).join('');
  return '<div>'
    + '<div style="display:flex; align-items:stretch; margin:0; font-size:11px; color:#000; box-shadow: inset 0 -1px #c8c8c8;">'
    +   '<div style="flex:1; min-width:0; padding:4px 8px; box-shadow: inset -1px 0 #c8c8c8;">Name</div>'
    +   '<div class="col-type" style="width:150px; flex:none; padding:4px 8px; box-shadow: inset -1px 0 #c8c8c8;">Type</div>'
    +   '<div style="width:170px; flex:none; padding:4px 8px;">'+esc(page.detailLabel || '')+'</div>'
    + '</div>' + rows + '</div>';
}

function aboutHTML(page){
  var body = page.body.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var links = '';
  if (page.links && page.links.length){
    var items = page.links.map(function(l){
      return '<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.name)+'</a>'
        + (l.detail ? ' <span style="color:#666;">— '+esc(l.detail)+'</span>' : '') + '</li>';
    }).join('');
    links = '<h2>Links</h2><ul>'+items+'</ul>';
  }
  return '<div class="doc-body" style="padding:24px 28px; max-width:640px;">'+body+links+'</div>';
}

function docHTML(item){
  var links = '';
  if (item.url || item.github){
    var parts = [];
    if (item.url) parts.push('<a href="'+esc(item.url)+'" target="_blank" rel="noopener">Visit ↗</a>');
    if (item.github && item.github !== item.url) parts.push('<a href="'+esc(item.github)+'" target="_blank" rel="noopener">GitHub repo ↗</a>');
    links = '<div class="doc-links">'+parts.join('')+'</div>';
  }
  return '<div style="padding:24px 28px; max-width:680px;">'
    + '<div class="doc-body">'+(item.body || '')+'</div>'
    + links + '</div>';
}

/* ---------- main render ---------- */
function render(){
  var s = parseView();
  var fv = $('fileview');
  var winIcon, winTitle, addr, stLeft, stMid;

  if (s.isHome){
    fv.innerHTML = homeHTML();
    winIcon = 'ic-floppy'; winTitle = SITE_NAME + ' (C:)';
    var selObj = null;
    for (var i = 0; i < SECTIONS.length; i++){ if (SECTIONS[i].id === state.selected){ selObj = SECTIONS[i]; break; } }
    addr = selObj ? ('C:\\' + SITE_NAME + '\\' + selObj.name) : ('C:\\' + SITE_NAME);
    stLeft = selObj ? '1 object selected' : (SECTIONS.length + ' object(s)');
    stMid = selObj ? (selObj.name + '  —  ' + selObj.desc) : 'Select an item, then double-click to open it.';
  } else if (s.isDoc){
    fv.innerHTML = docHTML(s.item);
    fv.scrollTop = 0;
    winIcon = s.item.icon; winTitle = s.item.name;
    addr = 'C:\\' + SITE_NAME + '\\' + PAGES[s.sec].name + '\\' + s.item.name;
    stLeft = '1 object(s)';
    stMid = s.item.type || PAGES[s.sec].name;
  } else { // folder
    var page = s.page;
    if (s.isAbout){
      fv.innerHTML = folderHeaderHTML(page.icon, page.name, page.desc) + aboutHTML(page);
      stLeft = '1 object(s)'; stMid = page.desc;
    } else {
      fv.innerHTML = folderHeaderHTML(page.icon, page.name, page.desc) + listHTML(page);
      var selRow = (state.selected && state.selected.indexOf('row:') === 0) ? page.items[+state.selected.slice(4)] : null;
      stLeft = selRow ? '1 object selected' : (page.items.length + ' object(s)');
      stMid = selRow ? (selRow.name + '  —  ' + selRow.type) : page.desc;
    }
    winIcon = page.icon; winTitle = page.name;
    addr = 'C:\\' + SITE_NAME + '\\' + page.name;
  }

  // chrome
  $('t-winicon').setAttribute('href', '#' + winIcon);
  $('addr-icon').setAttribute('href', '#' + winIcon);
  $('tb-winicon').setAttribute('href', '#' + winIcon);
  $('t-title').textContent = 'Exploring — ' + winTitle;
  $('tb-title').textContent = 'Exploring — ' + winTitle;
  $('addr').textContent = addr;
  $('st-left').textContent = stLeft;
  $('st-mid').textContent = stMid;

  // C: label highlight
  var cl = $('c-label');
  cl.setAttribute('style', 'cursor:pointer; padding:0 4px; ' + (s.isHome ? 'background:#000080; color:#fff;' : 'color:#000;'));

  // nav button disabled state
  $('btn-back').classList.toggle('disabled', !(state.hi > 0));
  $('btn-fwd').classList.toggle('disabled', !(state.hi < state.history.length - 1));
  $('btn-up').classList.toggle('disabled', state.view === 'home');

  renderTree();
  wireFileView();
}

function renderTree(){
  var v = state.view;
  var active = (v.indexOf('doc:') === 0) ? v.split(':')[1] : v;
  var html = SECTIONS.filter(function(sec){ return !!PAGES[sec.id]; }).map(function(it){
    var lbl = (active === it.id) ? 'background:#000080; color:#fff;' : 'color:#000;';
    return '<div class="tree-item" data-nav="'+it.id+'" style="display:flex; align-items:center; gap:6px; padding:2px 16px 2px 2px; cursor:pointer;"><svg width="15" height="15"><use href="#'+it.icon+'"></use></svg><span style="padding:0 4px; '+lbl+'">'+esc(it.name)+'</span></div>';
  }).join('');
  $('tree-items').innerHTML = html;
  var items = $('tree-items').querySelectorAll('[data-nav]');
  for (var i = 0; i < items.length; i++){
    (function(node){ node.addEventListener('click', function(){ setView(node.getAttribute('data-nav')); closeDrawer(); }); })(items[i]);
  }
}

/* ---------- mobile folder drawer ---------- */
function openDrawer(){ $('tree-pane').classList.add('show'); $('tree-backdrop').classList.add('show'); }
function closeDrawer(){ $('tree-pane').classList.remove('show'); $('tree-backdrop').classList.remove('show'); }
function toggleDrawer(){ $('tree-pane').classList.contains('show') ? closeDrawer() : openDrawer(); }

function wireFileView(){
  var fv = $('fileview');
  // home tiles
  var tiles = fv.querySelectorAll('[data-tile]');
  for (var i = 0; i < tiles.length; i++){
    (function(node){
      var id = node.getAttribute('data-tile');
      node.addEventListener('click', function(){ state.selected = (state.selected === id ? null : id); render(); });
      node.addEventListener('dblclick', function(){ if (PAGES[id]) setView(id); });
    })(tiles[i]);
  }
  // list rows
  var rows = fv.querySelectorAll('[data-row]');
  for (var j = 0; j < rows.length; j++){
    (function(node){
      var i = +node.getAttribute('data-row');
      var key = 'row:' + i;
      node.addEventListener('click', function(){ state.selected = (state.selected === key ? null : key); render(); });
      node.addEventListener('dblclick', function(){ openRow(i); });
    })(rows[j]);
  }
}

function openRow(i){
  var s = parseView();
  if (!s.isFolder) return;
  var item = s.page.items[i];
  if (item.open === 'external'){
    if (item.url) window.open(item.url, '_blank', 'noopener');
  } else {
    setView('doc:' + s.view + ':' + i);
  }
}

/* ---------- clock ---------- */
function tick(){
  var d = new Date();
  var h = d.getHours(); var m = d.getMinutes();
  var ap = h < 12 ? 'AM' : 'PM';
  h = h % 12; if (h === 0) h = 12;
  $('clock').textContent = h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
}

/* ---------- init ---------- */
$('btn-back').addEventListener('click', goBack);
$('btn-fwd').addEventListener('click', goFwd);
$('btn-up').addEventListener('click', goUp);
$('btn-folders').addEventListener('click', toggleDrawer);
$('tree-backdrop').addEventListener('click', closeDrawer);
$('c-label').addEventListener('click', function(){ setView('home'); closeDrawer(); });
tick(); setInterval(tick, 1000);
render();
</script>

</body>
</html>
